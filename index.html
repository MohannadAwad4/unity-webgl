<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Unity Web Player | CityRunArcade</title>
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes"
    />
    <style>
      html, body { margin:0; padding:0; height:100%; }
      #unity-canvas { display:block; width:100%; height:100%; background:#231F20; }
      #tiltDebug {
        position: fixed; left: 8px; top: 8px; z-index: 2147483647;
        background: rgba(0,0,0,.65); color:#0f0; padding:6px 8px; border-radius:6px;
        font: 12px / 1.2 -apple-system, system-ui, Segoe UI, Roboto;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="tiltDebug">booting…</div>

    <script src="Build/PlatformGame.loader.js"></script>
    <script>
      // small helpers
      function post(msg){ try{ window.ReactNativeWebView && window.ReactNativeWebView.postMessage(msg); }catch(e){} }
      function dbg(s){ var d = document.getElementById('tiltDebug'); if (d) d.textContent = s; }

      const canvas = document.querySelector('#unity-canvas');

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl:      "Build/PlatformGame.data.unityweb",
        frameworkUrl: "Build/PlatformGame.framework.js.unityweb",
        codeUrl:      "Build/PlatformGame.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "CityRunArcade",
        productVersion: "1.0.2",
        // matchWebGLToCanvasSize: false,
        // devicePixelRatio: 1,
      }).then((unityInstance) => {
        // 🔹 EXPOSE THE INSTANCE & DEFINE THE BRIDGE
        window.unityInstance = unityInstance;

        window.setTilt = function(v){
          // v is -1..1 (string or number)
          var f = Number(v);
          if (!isFinite(f)) f = 0;
          try {
            if (window.unityInstance && typeof window.unityInstance.SendMessage === 'function') {
              window.unityInstance.SendMessage('TiltReceiver', 'OnTilt', String(f));
              dbg('tilt ' + f.toFixed(3));
              post('__SENT_TO_UNITY__ ' + f);
            } else {
              dbg('unity not ready');
              post('__UNITY_NOT_READY__');
            }
          } catch (e) {
            console.error('setTilt SendMessage failed:', e);
            post('__SEND_ERROR__ ' + (e && e.message));
          }
        };

        dbg('unity: ready');
        post('__UNITY_READY_INDEX__');

        // Optional quick ping: comment out after verifying
        // setTimeout(() => window.setTilt(0.25), 1000);
      }).catch((message) => {
        console.error(message);
        alert(message);
      });
    </script>
  </body>
</html>
